apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME:-books-api}
  namespace: ${K8S_NAMESPACE:-production}
  labels:
    app: ${APP_NAME:-books-api}
    version: ${IMAGE_TAG:-latest}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ${APP_NAME:-books-api}
  template:
    metadata:
      labels:
        app: ${APP_NAME:-books-api}
        version: ${IMAGE_TAG:-latest}
    spec:
      serviceAccountName: ${APP_NAME:-books-api}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
      - name: ${APP_NAME:-books-api}
        image: ${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: SERVER_PORT
          value: "8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}